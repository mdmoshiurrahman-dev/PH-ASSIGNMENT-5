<style>

/* =========================================

========================================= */

#crosshair{

    width:20px;

#crosshair::before,

<div id="startScreen">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

/* ============================================================
   BLOCKCRAFT ENGINE
============================================================ */

/* ============================================================
   SETTINGS
============================================================ */

const CHUNK_SIZE = 16;

const RENDER_DISTANCE = 4;

const WORLD_HEIGHT = 18;

const PLAYER_HEIGHT = 1.8;

const PLAYER_SPEED = 6;

const JUMP_POWER = 8.5;

const GRAVITY = 22;

const MAX_RAY_DISTANCE = 7;


/* ============================================================
   SCENE
============================================================ */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(
        0x87ceeb
    );


/* ============================================================
   CAMERA
============================================================ */

const camera =
    new THREE.PerspectiveCamera(
        75,
        window.innerWidth /
        window.innerHeight,
        .1,
        500
    );

camera.position.set(
    0,
    10,
    0
);


/* ============================================================
   RENDERER
============================================================ */

const renderer =
    new THREE.WebGLRenderer({
        antialias:false,
        powerPreference:"high-performance"
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        1.5
    )
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
    THREE.PCFShadowMap;

document
    .getElementById("game")
    .appendChild(
        renderer.domElement
    );


/* ============================================================
   LIGHT
============================================================ */

const ambient =
    new THREE.AmbientLight(
        0xffffff,
        .65
    );

scene.add(ambient);


const sun =
    new THREE.DirectionalLight(
        0xffffff,
        1.1
    );

sun.position.set(
    50,
    80,
    30
);

sun.castShadow = true;

sun.shadow.mapSize.width = 1024;

sun.shadow.mapSize.height = 1024;

sun.shadow.camera.left = -80;

sun.shadow.camera.right = 80;

sun.shadow.camera.top = 80;

sun.shadow.camera.bottom = -80;

scene.add(sun);


/* ============================================================
   BLOCK TYPES
============================================================ */

const BLOCK = {

    GRASS:"grass",

    DIRT:"dirt",

    STONE:"stone",

    WOOD:"wood",

    LEAVES:"leaves",

    SAND:"sand",

    WATER:"water",

    GLASS:"glass",

    PLANKS:"planks",

    BRICK:"brick"

};


/* ============================================================
   MATERIALS
============================================================ */

const materials = {

    grass:
        new THREE.MeshLambertMaterial({
            color:0x5da63c
        }),

    dirt:
        new THREE.MeshLambertMaterial({
            color:0x80532f
        }),

    stone:
        new THREE.MeshLambertMaterial({
            color:0x777777
        }),

    wood:
        new THREE.MeshLambertMaterial({
            color:0x805027
        }),

    leaves:
        new THREE.MeshLambertMaterial({
            color:0x347f2c,
            transparent:true,
            opacity:.9
        }),

    sand:
        new THREE.MeshLambertMaterial({
            color:0xd6be76
        }),

    water:
        new THREE.MeshLambertMaterial({
            color:0x268bc9,
            transparent:true,
            opacity:.65
        }),

    glass:
        new THREE.MeshLambertMaterial({
            color:0xb9eaff,
            transparent:true,
            opacity:.4
        }),

    planks:
        new THREE.MeshLambertMaterial({
            color:0xa66a31
        }),

    brick:
        new THREE.MeshLambertMaterial({
            color:0xa64f40
        })

};


/* ============================================================
   GEOMETRY
============================================================ */

const cubeGeometry =
    new THREE.BoxGeometry(
        1,
        1,
        1
    );


/* ============================================================
   CHUNKS
============================================================ */

const chunks =
    new Map();


/* ============================================================
   BLOCKS
============================================================ */

const worldBlocks =
    new Map();


function blockKey(
    x,
    y,
    z
){

    return (
        x + "," +
        y + "," +
        z
    );

}


/* ============================================================
   CHUNK KEY
============================================================ */

function chunkKey(
    cx,
    cz
){

    return (
        cx + "," +
        cz
    );

}


/* ============================================================
   HASH
============================================================ */

function hash(
    x,
    z
){

    let h =
        x * 374761393 +
        z * 668265263;

    h =
        (h ^ (h >> 13)) *
        1274126177;

    h ^=
        h >> 16;

    return (
        h >>> 0
    ) / 4294967295;

}


/* ============================================================
   SMOOTH NOISE
============================================================ */

function smoothNoise(
    x,
    z
){

    const x0 =
        Math.floor(x);

    const z0 =
        Math.floor(z);

    const x1 =
        x0 + 1;

    const z1 =
        z0 + 1;

    const sx =
        x - x0;

    const sz =
        z - z0;

    const a =
        hash(x0,z0);

    const b =
        hash(x1,z0);

    const c =
        hash(x0,z1);

    const d =
        hash(x1,z1);

    const u =
        sx * sx *
        (3 - 2 * sx);

    const v =
        sz * sz *
        (3 - 2 * sz);

    const ab =
        a + (b-a) * u;

    const cd =
        c + (d-c) * u;

    return (
        ab +
        (cd-ab) * v
    );

}


/* ============================================================
   TERRAIN HEIGHT
============================================================ */

function terrainHeight(
    x,
    z
){

    const large =
        smoothNoise(
            x * .018,
            z * .018
        );

    const medium =
        smoothNoise(
            x * .045,
            z * .045
        );

    const small =
        smoothNoise(
            x * .11,
            z * .11
        );

    let height =
        4 +
        large * 7 +
        medium * 3 +
        small * 1.2;

    return Math.floor(
        height
    );

}


/* ============================================================
   TREE CHECK
============================================================ */

function shouldTree(
    x,
    z
){

    if(
        Math.abs(x) < 6 &&
        Math.abs(z) < 6
    ){
        return false;
    }

    const n =
        hash(
            x * 13 + 100,
            z * 17 + 200
        );

    return n > .87;

}


/* ============================================================
   CREATE WORLD BLOCK
============================================================ */

function createWorldBlock(
    x,
    y,
    z,
    type,
    group
){

    const key =
        blockKey(
            x,
            y,
            z
        );

    if(
        worldBlocks.has(key)
    ){
        return;
    }

    const material =
        materials[type];

    const cube =
        new THREE.Mesh(
            cubeGeometry,
            material
        );

    cube.position.set(
        x,
        y,
        z
    );

    cube.userData.type =
        type;

    cube.userData.x =
        x;

    cube.userData.y =
        y;

    cube.userData.z =
        z;

    cube.receiveShadow =
        true;

    cube.castShadow =
        type !== BLOCK.WATER;

    group.add(
        cube
    );

    worldBlocks.set(
        key,
        cube
    );

}


/* ============================================================
   CREATE TREE
============================================================ */

function createTree(
    x,
    y,
    z,
    group
){

    for(
        let i=0;
        i<5;
        i++
    ){

        createWorldBlock(
            x,
            y+i,
            z,
            BLOCK.WOOD,
            group
        );

    }


    for(
        let dx=-2;
        dx<=2;
        dx++
    ){

        for(
            let dz=-2;
            dz<=2;
            dz++
        ){

            for(
                let dy=3;
                dy<=5;
                dy++
            ){

                if(
                    Math.abs(dx) +
                    Math.abs(dz) <
                    4
                ){

                    createWorldBlock(
                        x+dx,
                        y+dy,
                        z+dz,
                        BLOCK.LEAVES,
                        group
                    );

                }

            }

        }

    }

    createWorldBlock(
        x,
        y+6,
        z,
        BLOCK.LEAVES,
        group
    );

}


/* ============================================================
   GENERATE CHUNK
============================================================ */

function generateChunk(
    cx,
    cz
){

    const key =
        chunkKey(
            cx,
            cz
        );

    if(
        chunks.has(key)
    ){
        return;
    }

    const group =
        new THREE.Group();

    group.userData.cx =
        cx;

    group.userData.cz =
        cz;

    const startX =
        cx * CHUNK_SIZE;

    const startZ =
        cz * CHUNK_SIZE;


    /* ======================================
       TERRAIN
    ====================================== */

    for(
        let lx=0;
        lx<CHUNK_SIZE;
        lx++
    ){

        for(
            let lz=0;
            lz<CHUNK_SIZE;
            lz++
        ){

            const x =
                startX + lx;

            const z =
                startZ + lz;

            const height =
                terrainHeight(
                    x,
                    z
                );


            for(
                let y=0;
                y<=height;
                y++
            ){

                let type =
                    BLOCK.DIRT;


                if(
                    y === height
                ){

                    type =
                        BLOCK.GRASS;

                }
                else if(
                    y < height - 3
                ){

                    type =
                        BLOCK.STONE;

                }


                createWorldBlock(
                    x,
                    y,
                    z,
                    type,
                    group
                );

            }


            /* =================================
               WATER
            ================================= */

            if(
                height < 5
            ){

                for(
                    let y=height+1;
                    y<=5;
                    y++
                ){

                    createWorldBlock(
                        x,
                        y,
                        z,
                        BLOCK.WATER,
                        group
                    );

                }

            }


            /* =================================
               TREE
            ================================= */

            if(
                height >= 7 &&
                shouldTree(
                    x,
                    z
                )
            ){

                createTree(
                    x,
                    height+1,
                    z,
                    group
                );

            }

        }

    }


    scene.add(
        group
    );

    chunks.set(
        key,
        group
    );

}


/* ============================================================
   LOAD WORLD AROUND PLAYER
============================================================ */

function updateChunks(){

    const playerCX =
        Math.floor(
            camera.position.x /
            CHUNK_SIZE
        );

    const playerCZ =
        Math.floor(
            camera.position.z /
            CHUNK_SIZE
        );


    for(
        let x=
            playerCX -
            RENDER_DISTANCE;

        x<=
            playerCX +
            RENDER_DISTANCE;

        x++
    ){

        for(
            let z=
                playerCZ -
                RENDER_DISTANCE;

            z<=
                playerCZ +
                RENDER_DISTANCE;

            z++
        ){

            const distance =
                Math.max(
                    Math.abs(
                        x-playerCX
                    ),
                    Math.abs(
                        z-playerCZ
                    )
                );

            if(
                distance <=
                RENDER_DISTANCE
            ){

                generateChunk(
                    x,
                    z
                );

            }

        }

    }


    /* ======================================
       UNLOAD FAR CHUNKS
    ====================================== */

    for(
        const [key,group]
        of chunks
    ){

        const cx =
            group.userData.cx;

        const cz =
            group.userData.cz;

        const distance =
            Math.max(
                Math.abs(
                    cx-playerCX
                ),
                Math.abs(
                    cz-playerCZ
                )
            );

        if(
            distance >
            RENDER_DISTANCE + 1
        ){

            unloadChunk(
                key,
                group
            );

        }

    }

}


/* ============================================================
   UNLOAD CHUNK
============================================================ */

function unloadChunk(
    key,
    group
){

    group.traverse(
        object => {

            if(
                object.isMesh
            ){

                const x =
                    object.userData.x;

                const y =
                    object.userData.y;

                const z =
                    object.userData.z;

                worldBlocks.delete(
                    blockKey(
                        x,
                        y,
                        z
                    )
                );

            }

        }
    );

    scene.remove(
        group
    );

    chunks.delete(
        key
    );

}


/* ============================================================
   PLAYER
============================================================ */

const player = {

    velocity:
        new THREE.Vector3(),

    direction:
        new THREE.Vector3(),

    onGround:false

};


/* ============================================================
   INPUT
============================================================ */

const keys = {};

window.addEventListener(
    "keydown",
    event => {

        keys[event.code] =
            true;

        if(
            event.code ===
            "Space"
        ){

            if(
                player.onGround
            ){

                player.velocity.y =
                    JUMP_POWER;

/* ============================================================
   GROUND COLLISION
============================================================ */

function getGround(
    x,
    z
){

    const bx =
        Math.floor(
            x
        );

    const bz =
        Math.floor(
            z
        );

    let highest =
        -Infinity;


    for(
        let dx=-1;
        dx<=1;
        dx++
    ){

        for(
            let dz=-1;
            dz<=1;
            dz++
        ){

            for(
                let y=
                    WORLD_HEIGHT;
                y>=0;
                y--
            ){

                const block =
                    worldBlocks.get(
                        blockKey(
                            bx+dx,
                            y,
                            bz+dz
                        )
                    );

                if(
                    block &&
                    block.userData.type !==
                    BLOCK.WATER &&
                    block.userData.type !==
                    BLOCK.LEAVES
                ){

                    highest =
                        Math.max(
                            highest,
                            y + .5
                        );

                    break;

                }

            }

        }

    }

    return highest;

}


/* ============================================================
   MOVEMENT
============================================================ */

function updatePlayer(
    delta
){

    player.direction.set(
        0,
        0,
        0
    );


    if(
        keys["KeyW"]
    ){
        player.direction.z -= 1;
    }

    if(
        keys["KeyS"]
    ){
        player.direction.z += 1;
    }

    if(
        keys["KeyA"]
    ){
        player.direction.x -= 1;
    }

    if(
        keys["KeyD"]
    ){
        player.direction.x += 1;
    }


    if(
        player.direction.lengthSq()
        > 0
    ){

        player.direction.normalize();


        const forward =
            new THREE.Vector3(
                0,
                0,
                -1
            );

        const right =
            new THREE.Vector3(
                1,
                0,
                0
            );


        forward.applyAxisAngle(
            new THREE.Vector3(
                0,
                1,
                0
            ),
            yaw
        );

        right.applyAxisAngle(
            new THREE.Vector3(
                0,
                1,
                0
            ),
            yaw
        );


        const movement =
            new THREE.Vector3();


        movement.addScaledVector(
            forward,
            -player.direction.z
        );

        movement.addScaledVector(
            right,
            player.direction.x
        );


        movement.normalize();


        camera.position.x +=
            movement.x *
            PLAYER_SPEED *
            delta;

        camera.position.z +=
            movement.z *
            PLAYER_SPEED *
            delta;

    }


    /* ======================================
       GRAVITY
    ====================================== */

    player.velocity.y -=
        GRAVITY *
        delta;

    camera.position.y +=
        player.velocity.y *
        delta;


    /* ======================================
       COLLISION
    ====================================== */

    const ground =
        getGround(
            camera.position.x,
            camera.position.z
        );


    if(
        ground !== -Infinity &&
        camera.position.y <
        ground + PLAYER_HEIGHT
    ){

        camera.position.y =
            ground +
            PLAYER_HEIGHT;

        player.velocity.y =
            0;

        player.onGround =
            true;

    }
    else{

        player.onGround =
            false;

    }

}

const raycaster =

function getTarget(){

    raycaster.setFromCamera(
        mouse,
        camera

    const meshes =

    for(
        const block
        of worldBlocks.values()
    ){

        meshes.push(

    const hits =
        raycaster.intersectObjects(
            meshes,
            false
        );


    if(
        hits.length === 0
    ){
        return null;
    }


    return hits[0];

}

/* ============================================================
   REMOVE BLOCK
============================================================ */

function removeBlock(
    block
){

    if(
        !block
    ){
        return;
    }


    const x =
        block.userData.x;

    const y =
        block.userData.y;

    const z =
        block.userData.z;


    if(
        y <= 0
    ){
        return;
    }


    const key =
        blockKey(
            x,
            y,
            z
        );


    worldBlocks.delete(
        key
    );


    if(
        block.parent
    ){

        block.parent.remove(
            block
        );

    }

}


/* ============================================================
   PLACE BLOCK
============================================================ */

function placeBlock(
    block,
    normal
){

    if(
        !block
    ){
        return;
    }


    const position =
        block.position
            .clone()
            .add(normal);


    const x =
        Math.round(
            position.x
        );

    const y =
        Math.round(
            position.y
        );

    const z =
        Math.round(
            position.z
        );


    if(
        y < 0 ||
        y > 100
    ){
        return;
    }


    const key =
        blockKey(
            x,
            y,
            z
        );


    if(
        worldBlocks.has(
            key
        )
    ){
        return;
    }


    /* ======================================
       Don't place inside player
    ====================================== */

    const dx =
        Math.abs(
            x -
            camera.position.x
        );

    const dz =
        Math.abs(
            z -
            camera.position.z
        );

    const dy =
        Math.abs(
            y -
            (camera.position.y-1)
        );


    if(
        dx < .8 &&
        dz < .8 &&
        dy < 2
    ){

        return;

    }


    const cx =
        Math.floor(
            x /
            CHUNK_SIZE
        );

    const cz =
        Math.floor(
            z /
            CHUNK_SIZE
        );


    const chunk =
        chunks.get(
            chunkKey(
                cx,
                cz
            )
        );


    if(!chunk){
        return;
    }


    createWorldBlock(
        x,
        y,
        z,
        inventoryTypes[
            selectedSlot
        ],
        chunk
    );

}

        cloud.add(

    );

    );
